[project]
name = "moonraker-neuralyzer"
version = "0.1.0"
description = "A Moonraker component that removes junk print jobs from history"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Morton Jonuschat" }]
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "jinja2==3.1.6",
    "ruff>=0.6",
]
